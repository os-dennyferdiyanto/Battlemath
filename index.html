function burst(){const b=document.createElement("div");b.className="burst";b.innerHTML=Array.from({length:16},()=>`<i style="--x:${Math.round(Math.random()*320-160)}px;--y:${-Math.round(60+Math.random()*220)}px;--r:${Math.round(Math.random()*180-90)}deg">${pk(["⭐","✨","🎉","🔥"])}</i>`).join("");document.body.appendChild(b);setTimeout(()=>b.remove(),1500)}
function parse(s){s=s.replace(/,/g,".").trim();let m;if(m=s.match(/^(\d+)$/))return[+m[1],1];if(m=s.match(/^(\d+)\s*\/\s*(\d+)$/))return+m[2]?fr(+m[1],+m[2]):null;if(m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))return+m[3]?fr(+m[1]*+m[3]+ +m[2],+m[3]):null;return null}
/* ===== SCREENS ===== */
function login(){SFX.music(false);role=null;me=null;ui=false;CM.clear();BM.clear();PM.clear();lastQ=-2;lastCtl="";const sv=JSON.parse(lsG("bk:me")||"{}");
$("#app").innerHTML=`<div class=hero><div class=logo>Σ</div><h1>MathLive</h1><p>SMK Bina Adzkia · Kuis Operasi Bilangan</p></div><div class=card><div class=tabs><button class=on data-t=s>Siswa</button><button data-t=a>Admin</button></div>
<div id=fs><input id=nm placeholder="Nama siswa" maxlength=24 value="${esc(sv.n||"")}"><input id=kl placeholder="Kelas (mis. X TJKT 1)" maxlength=16 value="${esc(sv.k||"")}"><input id=kd placeholder="Kode room (4 angka)" inputmode=numeric maxlength=4><button class=btn id=go>Masuk Room</button></div>
<div id=fa hidden><input id=au placeholder=Username autocapitalize=none><input id=ap type=password placeholder=Password><button class=btn id=ga>Masuk Admin</button></div><div id=err></div></div><p class=hint style="text-align:center">Mode: ${{online:"Online (multi-perangkat)",p2p:"Online P2P (komputer admin jadi server, jangan ditutup)",lokal:"Lokal (satu perangkat/browser)"}[B.mode]}</p>`;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));$("#fs").hidden=b.dataset.t!="s";$("#fa").hidden=b.dataset.t!="a"});
const er=t=>$("#err").textContent=t;
$("#go").onclick=async()=>{const n=$("#nm").value.trim(),k=$("#kl").value.trim(),c=$("#kd").value.trim();if(!n||!k||!c)return er("Lengkapi nama, kelas, dan kode room");const p2=B.mode=="p2p";if(p2){er("Menghubungkan ke room…");$("#go").disabled=true;try{await B.join(c)}catch(e){$("#go").disabled=false;return er("Room tidak ditemukan. Cek kode dan pastikan admin sudah membuat room.")}}else{if(!loaded)return er("Menghubungkan… coba lagi");if(!room||room.code!==c||room.st==="end")return er("Room tidak ditemukan atau sudah selesai")}
lsS("bk:me",JSON.stringify({n,k}));const id="p"+Math.abs([...(n+k+c).toLowerCase()].reduce((h,ch)=>h*31+ch.charCodeAt(0)|0,7)).toString(36);
const m0=players.find(p=>p.id===id)||{id,name:n,cls:k,code:c,xp:0,streak:0,ok:0,no:0,last:0,lq:-1,ans:{}};m0.ans=m0.ans||{};me=m0;role="s";shown={};missed={};cur=-1;if(p2){let got=0;B.onme=p=>{got=1;me=p;me.ans=me.ans||{}};B.onclose=()=>{if(role=="s"&&ui){toast("Terputus dari room");login()}};B.cn.send({t:"join",p:m0});for(let i=0;i<40&&!(got&&room);i++)await new Promise(r=>setTimeout(r,100));if(!room||room.st==="end"){role=null;me=null;$("#go").disabled=false;return er("Room sudah selesai atau tidak merespons")}}else B.setP(id,me);game()};
$("#ga").onclick=()=>{if($("#au").value!=="admin"||$("#ap").value!=="admin")return er("Username atau password salah");role="a";SFX.mOn=true;SFX.init();room&&room.st!=="end"?game():setup()};}
function setup(){$("#app").innerHTML=`<div class=hero><div class=logo>Σ</div><h1>Panel Admin</h1></div><div class=card><label>Judul kuis</label><input id=tt value="Operasi Bilangan"><label>Jumlah soal</label><select id=qn><option>10<option>20<option selected>30<option>50<option>100</select><label>Tingkat kesulitan</label><select id=md><option value=a>Acak campuran (L1 60% · L2 15% · L3 15% · L4 5% · L5 5%)${[1,2,3,4,5].map(l=>`<option value=${l}>Level ${l} · ${LV[l].n} (${LV[l].s} dtk · ${LV[l].x} XP)`).join("")}</select><label class=ck><input type=checkbox id=ao checked> Soal berikutnya otomatis</label><button class=btn id=mk>Buat Room</button><p class=hint>Bank soal: ${BANK.length} soal diacak · L1 300 · L2 75 · L3 75 · L4 25 · L5 25</p><button class=ghost id=bk style="width:100%;margin-top:8px">Kembali</button></div>`;
$("#bk").onclick=login;$("#mk").onclick=async()=>{const o={code:""+(1000+Math.floor(Math.random()*9000)),title:$("#tt").value||"Kuis",ids:pick(+$("#qn").value,$("#md").value),qi:-1,st:"lobby",ts:0,auto:$("#ao").checked?1:0};if(B.mode=="p2p"){let ok=0;for(let i=0;i<6&&!ok;i++){try{await B.host(o.code);ok=1}catch(e){o.code=""+(1000+Math.floor(Math.random()*9000))}}if(!ok)return toast("Gagal terhubung ke server P2P. Cek internet.")}await B.clear();players=[];revDone={};nexting=0;cur=-1;missed={};shown={};await B.setRoom(o);room=o;game()}}
function game(){ui=true;CM.clear();BM.clear();PM.clear();lastQ=-2;lastCtl="";
$("#app").innerHTML=`<div class=top><b>SMK Bina Adzkia</b><span id=rc class=badge></span><span class="badge ${B.mode!="lokal"?"on":""}">● ${B.mode!="lokal"?"Online":"Lokal"}</span><button class=ghost id=sx style="padding:5px 9px">🔊</button><button class=ghost id=mx style="padding:5px 9px">🎵</button><button class=ghost id=out style="padding:5px 10px">Keluar</button></div>
<section id=lobby><div class=pan style="text-align:center"><div class=mas>🧠</div><div class=hint>KODE ROOM</div><div class=code id=cd></div><div class=dots>Menunggu peserta <span>•</span><span>•</span><span>•</span></div><div class=pls id=pls></div></div></section>
<section id=live hidden><div class=qcard id=qc><div class=qh><span class=tag id=qn></span><span class=tag id=ql></span><span class=tag id=qk></span></div><div class=qrow><div class=qtxt id=qt></div><div class=ring id=ring><svg viewBox="0 0 84 84"><circle class=rb cx=42 cy=42 r=36 /><circle id=rg class=rf cx=42 cy=42 r=36 transform="rotate(-90 42 42)"/></svg><div class=rn><b id=rs>0</b><small>DTK</small></div></div></div><div class=bar><i id=bi></i></div><div class=bt><span>WAKTU MENJAWAB</span><span id=sisa></span></div><div id=res></div></div>
<div class=pan id=aa hidden><input id=ans placeholder="Ketik jawabanmu…" autocomplete=off autocapitalize=none enterkeyhint=send><button class=btn id=sub>Kirim Jawaban</button><div class=hint id=hint></div></div>
<div class=pan><h3>TERCEPAT MENJAWAB</h3><div class=fast id=fast></div></div></section>
<section id=fin hidden><div class=pan style="text-align:center"><div class=trophy>🏆</div><h2 id=champ style="margin:6px 0"></h2><div id=mine class=hint></div></div></section>
<div class=pan id=bp hidden><h3>PAPAN SKOR</h3><div class=board id=board></div><div class=hint id=myrank></div></div><div class=ctl id=ctl></div>`;
$("#out").onclick=login;const tg=()=>{$("#sx").textContent=SFX.sOn?"🔊":"🔇";$("#mx").style.opacity=SFX.mOn?1:.4};$("#sx").onclick=()=>{SFX.init();SFX.sOn=!SFX.sOn;tg()};$("#mx").onclick=()=>{SFX.init();SFX.mOn=!SFX.mOn;tg();sync()};tg();$("#sub").onclick=submit;$("#ans").onkeydown=e=>{if(e.key=="Enter")submit()};sync()}
/* ===== SYNC (render) ===== */
function sync(){if(!ui||!room||!role)return;if(role=="s"&&room.code!==me.code){toast("Room diganti admin");return login()}
const st=room.st,Q=q();SFX.music(st=="q"||st=="lobby");$("#rc").textContent="Room "+room.code;$("#lobby").hidden=st!="lobby";$("#live").hidden=!(st=="q"||st=="rev");$("#fin").hidden=st!="end";$("#bp").hidden=st=="lobby";
if(role=="s"){if(st=="q"&&room.qi!==cur){cur=room.qi;t0=Date.now();answered=!!me.ans[cur];$("#ans").value="";$("#ans").disabled=answered}
if(st=="rev"&&!me.ans[room.qi]&&!missed[room.qi]){missed[room.qi]=1;me.streak=0;me.no++;me.ans[room.qi]={v:"",ok:0,t:null,p:0};me.last=0;me.lq=room.qi;B.setP(me.id,me)}}
else if(st!==lastSt){if(st=="rev")nextAt=Date.now()+5000;nexting=0}lastSt=st;
if(st=="lobby"){$("#cd").textContent=room.code;keyed($("#pls"),PM,players,p=>{const e=document.createElement("span");e.className="pl";return e},(e,p)=>e.textContent=p.name+" · "+p.cls)}
if(Q&&(st=="q"||st=="rev")){$("#qn").textContent=`SOAL ${room.qi+1}/${room.ids.length}`;$("#ql").textContent=`Level ${Q.L} · ${LV[Q.L].n} · ${LV[Q.L].x} XP`;$("#qk").textContent=CN[Q.c];$("#qt").innerHTML=Q.h;
$("#hint").textContent=(Q.c=="P"?"Tulis satu pecahan, mis. 3/4 atau 17/12 (tanpa pecahan campuran) · ":"Jawab dengan bilangan bulat · ")+(me?`🔥 Streak ${me.streak} · bonus ×${(1+.1*Math.min(me.streak,5)).toFixed(1)}`:"");
$("#aa").hidden=!(role=="s"&&st=="q");
if(lastQ!==room.qi){lastQ=room.qi;pc=0;lastSec=-1;$("#fast").innerHTML="";CM.clear();$("#res").innerHTML="";const c=$("#qc");c.style.animation="none";void c.offsetWidth;c.style.animation=""}
const fl=players.filter(p=>p.ans&&p.ans[room.qi]&&p.ans[room.qi].t!=null).sort((a,b)=>a.ans[room.qi].t-b.ans[room.qi].t);if(st=="q"&&fl.length>pc)SFX.ping();pc=fl.length;
keyed($("#fast"),CM,fl,p=>{const e=document.createElement("div");e.className="chip";e.innerHTML="<span class=av></span><span class=nm></span><div class=tm></div><b class=vl></b><div class=xx></div>";avt(e.firstChild,p.name);e.querySelector(".nm").textContent=p.name;return e},(e,p,i)=>{const a=p.ans[room.qi],r=st=="rev";e.style.order=i;e.className="chip"+(r?a.ok?" ok":" bad":"");e.querySelector(".tm").textContent="⏱ "+a.t.toFixed(1)+"s";e.querySelector(".vl").textContent=r?(a.v||"—")+(a.ok?" ✓":" ✗"):"•••";e.querySelector(".xx").textContent="⭐ "+p.xp+(r&&a.ok?" (+"+a.p+")":"")});
if(st=="rev"){if(!shown["s"+room.qi]){shown["s"+room.qi]=1;const a0=me&&me.ans[room.qi];a0&&a0.ok?SFX.ok():me?SFX.bad():SFX.rev()}let h=`<span class=g>Jawaban benar: ${fmt(Q.a)}</span>`;if(me){const a=me.ans[room.qi];if(a&&a.ok){h+=`<br><span class=g>✅ Benar! +${a.p} XP</span>`;if(!shown[room.qi]){shown[room.qi]=1;burst()}}else h+=`<br><span class=r>❌ ${a&&a.v?"Belum tepat":"Waktu habis"}</span>`}$("#res").innerHTML=h}}
if(st!="lobby"){const all=rank(),shownL=st=="end"?all:all.slice(0,8);$("#board").style.height=shownL.length*50+"px";
keyed($("#board"),BM,shownL,p=>{const e=document.createElement("div");e.className="row";e.innerHTML="<span class=rk></span><span class=av></span><span class=nm></span><span class=xp></span><span class=dl></span>";avt(e.children[1],p.name);e.children[2].innerHTML=`${esc(p.name)}<small>${esc(p.cls)}</small>`;return e},(e,p,i)=>{e.style.transform=`translateY(${i*50}px)`;e.children[0].textContent=i+1;cnt(e.children[3],p.xp);const d=st=="rev"&&p.lq===room.qi&&p.last>0?"+"+p.last:"";if(e._d!==d){e._d=d;e.children[4].textContent=d;e.children[4].style.animation="none";void e.offsetWidth;e.children[4].style.animation=""}});
if(me){const i=all.findIndex(p=>p.id===me.id);$("#myrank").textContent=i>=0?`Peringkatmu: #${i+1} dari ${all.length} · ${all[i].xp} XP`:""}}
if(st=="end"){if(!shown.end){shown.end=1;SFX.win()}const w=rank()[0];$("#champ").textContent=w?`Juara: ${w.name} (${w.xp} XP)`:"Kuis selesai";$("#mine").textContent=me?`Hasilmu: ${me.ok} benar · ${me.no} salah · ${me.xp} XP`:""}
if(role=="a")ctl()}
function ctl(){const st=room.st,k=st+room.qi+room.auto+players.length*(st=="lobby");if(k===lastCtl)return;lastCtl=k;const c=$("#ctl");
c.innerHTML=st=="lobby"?`<button class=btn id=go2>▶ Mulai Kuis (${room.ids.length} soal)</button>`:st=="q"?`<button class=btn id=rv>Tampilkan Jawaban</button><button class=ghost id=ed>Akhiri</button>`:st=="rev"?`<button class=btn id=nx data-c="">Soal Berikutnya</button><label><input type=checkbox id=au2 ${room.auto?"checked":""}> Auto</label><button class=ghost id=ed>Akhiri</button>`:`<button class=btn id=ex>⬇ Export CSV</button><button class=ghost id=nr>Room Baru</button>`;
const on=(i,f)=>{const e=$("#"+i);if(e)e.onclick=f};on("go2",next);on("nx",next);on("rv",reveal);on("ed",()=>upd({st:"end"}));on("ex",exp);on("nr",setup);const a=$("#au2");if(a)a.onchange=()=>upd({auto:a.checked?1:0})}
const upd=o=>{room={...room,...o};B.setRoom(room);sync()};
function next(){nexting=1;if(room.qi+1>=room.ids.length)upd({st:"end"});else upd({qi:room.qi+1,st:"q",ts:Date.now()})}
function reveal(){upd({st:"rev"})}
/* ===== ANSWER & TIMER ===== */
function submit(){const Q=q();if(role!="s"||answered||room.st!="q"||!Q)return;const v=$("#ans").value.trim();if(!v)return;const a=parse(v);if(!a)return toast("Format jawaban belum benar");
const s=LV[Q.L].s,el=(Date.now()-t0)/1000;if(el>s+.3)return;const ok=a[0]===Q.a[0]&&a[1]===Q.a[1];let p=0;
if(ok){p=Math.round(LV[Q.L].x*(.5+.5*Math.max(0,1-el/s))*(1+.1*Math.min(me.streak,5)));me.streak++;me.xp+=p;me.ok++}else{me.streak=0;me.no++}
me.ans[cur]={v,ok:ok?1:0,t:+el.toFixed(1),p};me.last=p;me.lq=cur;answered=true;$("#ans").disabled=true;B.setP(me.id,me);toast("Jawaban terkirim ✔");SFX.pop();sync()}
function ring(rem,s){const r=$("#ring");$("#rg").style.strokeDashoffset=226*(1-rem/s);r.className="ring"+(rem<=s*.1||rem<=3?" cr":rem<=s*.3?" lo":"");$("#rs").textContent=Math.ceil(rem);$("#bi").style.width=rem/s*100+"%";$("#sisa").textContent=`sisa ${rem.toFixed(1)}s`}
function tick(){if(!ui||!room||!role)return;const Q=q();if(room.st=="q"&&Q){const s=LV[Q.L].s,rem=Math.max(0,s-(Date.now()-(role=="a"?room.ts:t0))/1000);ring(rem,s);const sc0=Math.ceil(rem);if(sc0!==lastSec){lastSec=sc0;if(sc0>0&&sc0<=5)SFX.tick(sc0);else if(sc0==0)SFX.end()}
if(role=="a"&&!revDone[room.qi]&&(rem<=0||(players.length&&players.every(p=>p.ans&&p.ans[room.qi])))){revDone[room.qi]=1;reveal()}
if(role=="s"&&rem<=0&&!answered)$("#ans").disabled=true}
else if(room.st=="rev"){ring(0,1);if(role=="a"&&room.auto){const nx=$("#nx"),r=Math.ceil((nextAt-Date.now())/1000);if(nx)nx.dataset.c=Math.max(0,r);if(Date.now()>=nextAt&&!nexting)next()}}}
/* ===== EXPORT CSV ===== */
async function exp(){const ids=room.ids.slice(0,Math.max(0,room.qi+1)),c=s=>'"'+String(s).replace(/"/g,'""')+'"';
const H=["Peringkat","Nama","Kelas","Total XP","Benar","Salah","Tidak Dijawab","Akurasi %","Rata2 Waktu Benar (dtk)",...ids.map((id,i)=>`S${i+1} [L${BANK[id].L}] ${BANK[id].t} = ${fmt(BANK[id].a)}`)];
const rows=rank().map((p,i)=>{const A=ids.map((_,k)=>p.ans&&p.ans[k]),ok=A.filter(a=>a&&a.ok),no=A.filter(a=>a&&!a.ok&&a.v!=="");return[i+1,p.name,p.cls,p.xp,ok.length,no.length,ids.length-ok.length-no.length,ids.length?Math.round(100*ok.length/ids.length):0,ok.length?(ok.reduce((s,a)=>s+a.t,0)/ok.length).toFixed(1):"",...A.map(a=>a&&a.v!==""?`${a.ok?"Benar":"Salah"} | jawab: ${a.v} | ${a.t}s | +${a.p}`:"Kosong")]});
const data="\ufeff"+[H,...rows].map(r=>r.map(c).join(",")).join("\r\n"),fn=`hasil-${room.title.replace(/\W+/g,"-")}-${room.code}.csv`;
try{const d=window.claude&&claude.use?await claude.use("downloads"):null;if(d)await d.save({filename:fn,data});else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download=fn;a.click()}}catch(e){toast("Download dibatalkan")}}
/* ===== BOOT ===== */
for(let i=0;i<10;i++){const b=document.createElement("div"),s=20+Math.random()*60;b.className="bub";b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s`;document.body.appendChild(b)}
(async()=>{document.addEventListener("pointerdown",()=>SFX.init());await B.init();B.watchRoom(r=>{room=r;loaded=true;sync()});B.watchP(l=>{players=l;sync()});login();setInterval(tick,100)})();
</script></body></html>
